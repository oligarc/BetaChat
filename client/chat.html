<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>426Comics Beta Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icons/hogar.svg">
    <script type="module">

        import {io} from "https://cdn.socket.io/4.3.2/socket.io.esm.min.js";
        
        const socket = io({
            auth:{
                serverOffset:0
            }
        });

        const form = document.getElementById('form');
        const input = document.getElementById('message');
        const messages = document.getElementById('messages');
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName');
        const pUser = document.getElementById('userName');

        pUser.innerHTML=`${userName}`

        socket.on('chat message', (msg) => {
            const item=`<li><span>${msg.userName}: </span>${msg.content}</li>`
            messages.insertAdjacentHTML('beforeend', item);
            socket.auth.serverOffset=msg.serverOffset; //Updating the last message the client has seen
            messages.scrollTop = messages.scrollHeight; //This will automatically scroll instead having you to do it
        })

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if(input.value){
                socket.emit('chat message', {content: input.value, userId:userId});
                input.value='';
            }
        })

    </script>
</head>
<body>
    <header>
        <p id="userName"></p>
    </header>
    <section id="chat">
        <ul id="messages"></ul>
    <form id="form">
        <input type="text" name="message" id="message" placeholder="Manda un mensaje">
        <button id="button"><img src="/icons/send.svg" alt="sendButton"></button>
    </form>
    </section>
    
</body>
</html>
