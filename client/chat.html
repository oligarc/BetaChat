<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>426Comics Beta Chat</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">

        import {io} from "https://cdn.socket.io/4.3.2/socket.io.esm.min.js";
        
        const socket = io({
            auth:{
                serverOffset:0
            }
        });

        const form = document.getElementById('form');
        const input = document.getElementById('message');
        const messages = document.getElementById('messages');
        const userId = localStorage.getItem('userId');

        socket.on('chat message', (msg,serverOffset) => {
            const item=`<li>${msg}</li>`
            messages.insertAdjacentHTML('beforeend', item);
            socket.auth.serverOffset=serverOffset; //Updating the last message the client has seen
        })

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if(input.value){
                socket.emit('chat message', {content: input.value, userId:userId});
                input.value='';
            }
        })

    </script>
</head>
<body>
    <section id="chat">
        <ul id="messages"></ul>
    <form id="form">
        <input type="text" name="message" id="message" placeholder="Manda un mensaje">
        <button id="button">Enviar</button>
    </form>
    </section>
    
</body>
</html>
